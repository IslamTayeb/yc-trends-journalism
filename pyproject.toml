[project]
name = "ycnative"
version = "0.1.0"
description = "YC batch composition over time using YC's native taxonomy"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "requests>=2.31",
  "streamlit>=1.38",
  "plotly>=5.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycnative"]
