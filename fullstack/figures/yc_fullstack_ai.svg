</style><rect class="ground" width="768" height="545"/><text x="24.0" y="26.0" class="kick mono f-r" text-anchor="start">§ FIG 4  ·  FULL-STACK AI COMPANIES</text><text x="24.0" y="54.0" class="h" text-anchor="start">Full-stack AI companies are 12% of YC's Summer 2026 batch.</text><text x="24.0" y="80.0" class="h" text-anchor="start">Before ChatGPT they were never more than 4%.</text><text x="24.0" y="102.0" class="dek m" text-anchor="start">Share of each batch's companies that run the service themselves with AI doing</text><text x="24.0" y="121.0" class="dek m" text-anchor="start">the core work (Jared Friedman's definition), Winter 2019 to Summer 2026.</text><line x1="56.0" y1="344.3" x2="636.0" y2="344.3" class="grid" stroke-width="1"/><line x1="56.0" y1="247.7" x2="636.0" y2="247.7" class="grid" stroke-width="1"/><line x1="56.0" y1="151.0" x2="636.0" y2="151.0" class="grid" stroke-width="1"/><text x="48.0" y="445.0" class="tick mono m" text-anchor="end">0</text><text x="48.0" y="348.3" class="tick mono m" text-anchor="end">5%</text><text x="48.0" y="251.7" class="tick mono m" text-anchor="end">10%</text><text x="48.0" y="155.0" class="tick mono m" text-anchor="end">15%</text><line x1="56.0" y1="441.0" x2="636.0" y2="441.0" class="axis" stroke-width="1"/><line x1="56.0" y1="441.0" x2="56.0" y2="449.0" class="axis" stroke-width="1"/><text x="56.0" y="463.0" class="tick mono m" text-anchor="middle">2019</text><line x1="86.5" y1="441.0" x2="86.5" y2="445.0" class="axis" stroke-width="1"/><line x1="117.1" y1="441.0" x2="117.1" y2="449.0" class="axis" stroke-width="1"/><text x="117.1" y="463.0" class="tick mono m" text-anchor="middle">2020</text><line x1="147.6" y1="441.0" x2="147.6" y2="445.0" class="axis" stroke-width="1"/><line x1="178.1" y1="441.0" x2="178.1" y2="449.0" class="axis" stroke-width="1"/><text x="178.1" y="463.0" class="tick mono m" text-anchor="middle">2021</text><line x1="208.6" y1="441.0" x2="208.6" y2="445.0" class="axis" stroke-width="1"/><line x1