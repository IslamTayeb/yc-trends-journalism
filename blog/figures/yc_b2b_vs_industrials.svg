.imt text{fill:var(--ink)}.imt .m{fill:var(--mut)}.imt .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
.imt .kick{font-size:11px;font-weight:700;letter-spacing:.2em}.imt .h{font-size:18px;font-weight:600}
